name: home_sync
description: "HomeSync - Smart Home Warranty, Maintenance & Asset Manager."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1

  # Backend & Realtime Database
  supabase_flutter: ^2.8.4
  google_sign_in: ^7.2.0

  # Push Notifications
  onesignal_flutter: ^5.3.4

  # Navigation & Routing
  go_router: ^18.0.0

  # UI Design System, Fonts & Icons
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.17
  cupertino_icons: ^1.0.8

  # Image Handling, Scanner & Caching
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  mobile_scanner: ^7.4.0

  # Document & PDF Export (Insurance & Warranty Reports)
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.5

  # Calendar & Sharing Features
  add_2_calendar: ^3.0.1
  qr_flutter: ^4.1.0

  # Utilities, Formatters & Storage
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  http: ^1.3.0
  uuid: ^4.5.1

  # Functional Programming (Either, Option, TaskEither)
  fpdart: ^1.1.0

  # Dependency Injection (Service Locator)
  get_it: ^9.2.1

  # Data Immutability & Serialization Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Quality Linter
  flutter_lints: ^6.0.0

  # Code Generators
  build_runner: ^2.4.0
  freezed: ^4.0.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # App Launcher Icon Generator
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
